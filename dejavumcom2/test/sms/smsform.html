<html>
  <form method="post" action="smssend.php">
     <input type="hidden" name="action" value="go">
     전송메세지 
	 <TEXTAREA NAME="msg" ROWS="" COLS=""></TEXTAREA>
	<!--  <input type="text" name="msg" maxlength="80" size=80> --> 예)80byte 이하로 입력. 
     <br>받는 번호 <input type="text" name="rphone" value="010-9690-1369"> 예) 011-012-1234 , '-' 포함해서 입력.
     <br>받는 번호&이름 <input type="text" name="destination" value="" size=80> 예) 010-000-0000|홍길동
	 <br>
     보내는 번호<input type="text" name="sphone1" maxlength="4" value="010-9690-1369">-
     <input type="text" name="sphone2" maxlength="4" value="000">-
     <input type="text" name="sphone3" maxlength="4" value="0000">
     <br>예약 날짜 <input type="text" name="rdate" maxlength="8"> 예)20090909
     <br>예약 시간 <input type="text" name="rtime" maxlength="6"> 예)173000 ,오후 5시 30분,예약시간은 최소 10분 이상으로 설정.
     <br>return url <input type="text" name="returnurl" maxlength="64" value="http://userid.cafe24.com/sms/send01.html" >
    <br> test flag <input type="text" name="testflag" maxlength="1" value="Y"> 예) 테스트시: Y
     <br>nointeractive <input type="text" name="nointeractive" maxlength="1"> 예) 사용할 경우 : 1, 성공시 대화상자(alert)를 생략.
     <br>반복설정 <input type="checkbox" name="repeatFlag" value="Y">
    <br> 반복횟수 <select name="repeatNum"> 
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            </select> 예) 1~10회 가능.
     <br>전송간격<select name="repeatTime"> 예)15분 이상부터 가능. 
            <option value="15">15</option>
            <option value="20">20</option>
            <option value="25">25</option>
            </select>분마다
            <br>
     <input type="submit" value="전송">
  </form>
</html>
